{% extends "admin/base_site.html" %}
{% load admin_urls %}
{% block content %}
<div id="content-main">
    <p>{{ message }}</p>
    <form method="post">
        {% csrf_token %}
        <input type="submit" value="Yes, continue">
        <a href="{% url opts|admin_urlname:'changelist' %}" class="button cancel-link">Cancel</a>
    </form>
</div>
{% endblock %}
