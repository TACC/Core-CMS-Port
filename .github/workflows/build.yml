name: Build
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release/version tag to publish'
        required: false
        type: string
  push:
    tags: ['v*']

jobs:
  build_commit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set image tag variables
        id: vars
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          BRANCH_TAG=$(echo "$GITHUB_REF_NAME" | sed 's/[^[:alnum:]\.\_\-]/-/g')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          {
            echo 'TAGS<<EOF'
            echo "taccwma/core-cms-port:$SHORT_SHA"
            echo "taccwma/core-cms-port:$BRANCH_TAG"
            if [ -n "$RELEASE_TAG" ]; then
              echo "taccwma/core-cms-port:$RELEASE_TAG"
            fi
            echo 'taccwma/core-cms-port:latest'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: cms
          push: true
          tags: ${{ steps.vars.outputs.TAGS }}
