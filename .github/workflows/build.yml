name: Build
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'Git ref to check out for a release build'
        required: false
        type: string
      image_tag:
        description: 'Release/version tag to publish'
        required: false
        type: string
  push:
    branches: [main, feat/core-cms-port-image]
    tags: ['v*']

jobs:
  build_commit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set image tag variables
        id: vars
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          REF_NAME="${IMAGE_TAG:-$GITHUB_REF_NAME}"
          echo "BRANCH_NAME=$(echo "$REF_NAME" | sed 's/[^[:alnum:]\.\_\-]/-/g')" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: cms
          push: true
          tags: taccwma/core-cms-port:${{ steps.vars.outputs.SHORT_SHA }},taccwma/core-cms-port:${{ steps.vars.outputs.BRANCH_NAME }},taccwma/core-cms-port:latest
